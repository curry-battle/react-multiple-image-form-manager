packages:
  - packages/*
  - examples/*

# 公開から一定時間が経つまで新規バージョンを解決しない（cooldown）。pnpm の単位は「分」。
# 7 days = 7 × 1440 = 10080 分。
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  [
    # Renovate security update: valibot@1.4.2
    valibot@1.4.2,
    # Renovate security update: uuid@13.0.1
    uuid@13.0.1
  ]

blockExoticSubdeps: true

# 依存のライフサイクルスクリプト（postinstall 等）は既定でブロックされる。
# 実行を許可するパッケージのみ allowlist に明示する。
allowBuilds: {}

# スクリプト実行前に node_modules と lockfile の整合を検証する。
verifyDepsBeforeRun: error
