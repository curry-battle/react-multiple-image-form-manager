name: Release Drafter

# PR イベントでは起動しない。releaser は起動のたびに Draft Release を作り直すため、
# publish ワークフローが設定した target が PR イベントで巻き戻る。
# v7.5.1 に releaser だけを止める入力は無いので、トリガー自体を main への push に限る。
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  update_release_draft:
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
