name: Publish Package

# タグは immutable なので、焼く前にパッケージを公開しておく。
# release: published を待つと、publish 失敗時にそのバージョンが永久欠番になる。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-package
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # バージョン更新コミットを main へ push するため認証情報を残す
          persist-credentials: true

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # release-drafter がラベルから解決したバージョンを唯一の源とする。
      # package.json 側を正にすると、リリースノートと実際の公開物がずれても検知できない。
      - name: Resolve version from draft release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          drafts=$(gh release list --json tagName,isDraft --jq '[.[] | select(.isDraft) | .tagName]')
          count=$(jq 'length' <<<"$drafts")
          if [ "$count" -ne 1 ]; then
            echo "::error::Draft Release は1件だけ必要です（現在 ${count} 件）"
            exit 1
          fi
          tag=$(jq -r '.[0]' <<<"$drafts")
          version=${tag#v}
          if ! grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' <<<"$version"; then
            echo "::error::Draft の tag からバージョンを解釈できません: ${tag}"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Ensure the tag does not exist yet
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::タグ ${TAG} は既に存在します。追加の PR をマージしてバージョンを進めてください"
            exit 1
          fi

      # install より前に bump する。verifyDepsBeforeRun が有効なため、install 後に
      # workspace の package.json を書き換えると以降の pnpm run が全て弾かれる。
      # バージョンは pnpm-lock.yaml に載らない（workspace 依存は link: 記録）ので
      # --frozen-lockfile は bump 後も通る。
      - name: Bump package version
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          cd packages/react-multiple-image-form-manager
          current=$(node -p "require('./package.json').version")
          if [ "$current" = "$VERSION" ]; then
            echo "package.json は既に ${VERSION} です"
            exit 0
          fi
          npm version "$VERSION" --no-git-tag-version

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run check:ci

      # unit tests は Vitest Browser Mode で動くので chromium の実体が要る
      - name: Install Playwright browsers
        run: pnpm run test:e2e:install

      - name: Unit tests
        run: pnpm test

      # publish より前に push する。公開済みパッケージに対応するコミットが
      # main に無い状態を作らないため。
      - name: Commit and push the version bump
        id: push
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          if ! git diff --quiet -- packages/react-multiple-image-form-manager/package.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/react-multiple-image-form-manager/package.json
            git commit -m "chore(release): v${VERSION}"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: |
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
          pnpm --filter @curry-battle/react-multiple-image-form-manager publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # publish 済みで失敗しうるのはここだけなので、job を分けて単独で再実行できるようにする
  update-draft:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Point the draft release at the published commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.publish.outputs.tag }}
          SHA: ${{ needs.publish.outputs.sha }}
        run: gh release edit "$TAG" --target "$SHA"
