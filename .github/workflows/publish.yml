name: Publish Package

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Determine version
        id: version
        run: echo "version=v$(node -p "require('./packages/react-multiple-image-form-manager/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: |
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
          pnpm --filter @curry-battle/react-multiple-image-form-manager publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-draft:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Update draft release tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          DRAFT_TAG=$(gh release list --json tagName,isDraft --jq '[.[] | select(.isDraft)] | .[0].tagName // empty')
          if [ -n "$DRAFT_TAG" ]; then
            gh release edit "$DRAFT_TAG" --tag "$VERSION" --title "$VERSION" --target "$GITHUB_SHA"
          else
            gh release create "$VERSION" --draft --generate-notes --target "$GITHUB_SHA"
          fi
