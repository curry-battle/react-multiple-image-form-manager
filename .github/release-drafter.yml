name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
version-template: '$MAJOR.$MINOR.$PATCH'

# バージョンはカテゴリの semver-increment から解決される。
# v0.x のうちは breaking でも feature を使う運用なので、breaking カテゴリに
# major を置いても実際には major へ上がらない（#23 の方針）。
categories:
  - title: '💥 Breaking Changes'
    semver-increment: 'major'
    when:
      label: 'breaking'
  - title: '🚀 Features'
    semver-increment: 'minor'
    when:
      label: 'feature'
  - title: '🐛 Bug Fixes'
    semver-increment: 'patch'
    when:
      label: 'fix'
  - title: '⚡ Performance'
    semver-increment: 'patch'
    when:
      label: 'perf'
  - title: '♻️ Refactoring'
    semver-increment: 'patch'
    when:
      label: 'refactor'
  - title: '🧰 Maintenance'
    semver-increment: 'patch'
    when:
      labels: ['docs', 'test', 'build', 'ci', 'chore', 'revert']

  - type: 'pre-exclude'
    when:
      label: 'skip-changelog'

  # ラベルの付いていない PR の既定値。changelog には出さずに patch だけ寄与させる
  - type: 'version-resolver'
    semver-increment: 'patch'

autolabeler:
  - label: 'breaking'
    title:
      - '/^\w+(\(.+\))?!:\s/'
    body:
      - '/BREAKING[ -]CHANGE:/'
  - label: 'feature'
    title:
      - '/^feat(\(.+\))?:\s/i'
  - label: 'fix'
    title:
      - '/^fix(\(.+\))?:\s/i'
  - label: 'perf'
    title:
      - '/^perf(\(.+\))?:\s/i'
  - label: 'refactor'
    title:
      - '/^refactor(\(.+\))?:\s/i'
  - label: 'docs'
    title:
      - '/^docs(\(.+\))?:\s/i'
  - label: 'test'
    title:
      - '/^test(\(.+\))?:\s/i'
  - label: 'build'
    title:
      - '/^build(\(.+\))?:\s/i'
  - label: 'ci'
    title:
      - '/^ci(\(.+\))?:\s/i'
  - label: 'chore'
    title:
      - '/^chore(\(.+\))?:\s/i'
  - label: 'revert'
    title:
      - '/^revert(\(.+\))?:\s/i'

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
change-title-escapes: '\<*_&'
